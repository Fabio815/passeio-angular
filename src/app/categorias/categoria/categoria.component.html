<div class="p-6 max-w-lg mx-auto bg-white shadow-lg rounded-lg mt-6">
    <h2 class="text-2x1 font-semibold text-gray-700 mb-4">Nova categoria</h2>
    <hr>
    <!--Campo 1 Nome-->
    <form id="categoriaForm">
        <div class="mb-4">
            <label class="block text-gray-600 font-medium mb-2">Nome</label>
            <input type="text" 
                id="nome" 
                name="nome" 
                placeholder="Ex: Restaurante, Shopping..."
                class="w-full p-3 border border-gray-300 rounded shadow-sm focus: ring focus: ring-blue-400"
                required
                />
            <span class="text-red-500 text-sm">
                Campo obrigátorio
            </span>
        </div>

        <!--Campo 2 Descrição-->
        <div class="mb-4">
            <label class="block text-gray-600 font-medium mb-2">Descrição</label>
            <textarea type="text"
                rows="4"
                id="descricao" 
                name="descricao" 
                placeholder="Ex: Restaurante, Shopping..."
                class="w-full p-3 border border-gray-300 rounded shadow-sm focus:outline-none focus: ring focus: ring-blue-400"
                required
            >
            </textarea>
            <span class="text-red-500 text-sm">
                Campo obrigátorio
            </span>
        </div>

        <!--Botão de salvar-->
        <button type="submit" class="w-full bg-clue-600 text-white font-semibold p-3 rounded shadow hover: bg-blue-700">
            Cadastrar categoria
        </button>
    </form>
</div>
